services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      MAX_FILE_SIZE_MB: 25
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api
